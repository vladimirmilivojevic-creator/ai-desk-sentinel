name: fire-test

# Rucna provera API okidaca za routinu desk-shock (secrets FIRE_URL i FIRE_TOKEN).
# Salje TEST dogadjaj koji je mozak vec obradio, pa routina treba da javi "vec obradjen" i da ne postavi nalog.
# Bezbedno samo dok je u desk/CONTROL.md EVENT_TRADING: OFF (a i tada je dogadjaj vec obradjen).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Okini routinu desk-shock sa TEST dogadjajem
        env:
          FIRE_URL: ${{ secrets.FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.FIRE_TOKEN }}
        run: |
          mkdir -p _state
          python - <<'PY'
          import time
          from sentinel.util import iso, write_json
          payload = {"v": 1, "tier": "N3", "event_ids": ["EV-20261006T1430Z-TEST"],
                     "sha12": {"EV-20261006T1430Z-TEST": "537736ef1f4f"}}
          write_json("_state/pending_fire.json", {"payload": payload, "created": iso(time.time()), "attempts": 0})
          PY
          python -m sentinel.fire --state _state

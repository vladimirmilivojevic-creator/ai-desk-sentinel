name: studies

# Stalni test (odluka vlasnika 2026-10-10): jednokratne studije se ponavljaju svake nedelje na svežim podacima, jer se tržište menja.
# Bez AI-ja, bez tajni, ne trguje. Rezultati idu u calibration/ na main. Ako preuzimanje podataka ne uspe, workflow samo pada i stari fajl ostaje.
on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studies
  cancel-in-progress: false

jobs:
  studies:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Satna pravila, sirina stopa (sveze svece)
        run: python -m lab.hourly_stops calibration/hourly_stops.md --fresh
      - name: Biranje strane prati / suprotno (sveze svece)
        run: python -m lab.adaptive_side calibration/adaptive_side.md --fresh
      - name: Objavi na main
        run: |
          set -e
          git config user.name "sentinel-bot"
          git config user.email "sentinel-bot@users.noreply.github.com"
          git add calibration/hourly_stops.md calibration/adaptive_side.md
          if git diff --cached --quiet; then echo "nema promena"; exit 0; fi
          git commit -q -m "studije (nedeljno) $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && { echo "objavljeno"; exit 0; }
            sleep $((RANDOM % 5 + 2))
          done
          echo "push na main nije uspeo"; exit 1
